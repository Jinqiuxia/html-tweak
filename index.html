<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Tweak — simple, lightweight HTML editor</title>
<meta name="description" content="The simplest, lightest HTML editor. Open any HTML file in your browser and tweak it by hand — visually or in code, live preview. No install, no coding required. Great for fixing up AI-generated pages.">
<meta name="theme-color" content="#0E1544">
<meta property="og:title" content="HTML Tweak — simple, lightweight HTML editor">
<meta property="og:description" content="Open any HTML file and tweak it by hand — visually or in code. One file, no install, no coding needed.">
<meta property="og:type" content="website">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230E1544%22/&gt;&lt;circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22%2346BBA0%22/&gt;&lt;/svg&gt;">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">

<style>
  :root {
    --bg:#0E1544; --surface:#171F52; --surface-2:#212A63; --border:#2C3670;
    --text:#E7EAF6; --text-dim:#97A0C6;
    --accent:#46BBA0; --accent-ink:#0E1544; --accent-hi:#5FD0B6;
    --match:rgba(245,196,81,.22); --radius:10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: Inter, system-ui, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); }

  #toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #toolbar button { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  #toolbar button:hover { background: var(--surface-2); border-color: var(--accent); }
  #toolbar select { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 13px; cursor: pointer; }
  #toolbar select:focus { border-color: var(--accent); outline: none; }
  #toolbar .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
  #brand { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; color: var(--text); margin-right: 6px; }
  #brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  #siteLink { font-size: 12px; font-weight: 700; letter-spacing: .5px; color: var(--accent); text-decoration: none; margin-left: 8px; }
  #siteLink:hover { text-decoration: underline; }
  #toolbar #undoBtn, #toolbar #redoBtn { background: var(--surface-2); border-color: var(--accent); font-size: 16px; line-height: 1; padding: 5px 12px; }
  #toolbar #undoBtn:hover, #toolbar #redoBtn:hover { background: var(--accent); color: var(--accent-ink); }

  #fmtBar, #codeTools { display: inline-flex; align-items: center; gap: 3px; flex-wrap: wrap; }
  #fmtBar button, #codeTools button { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 6px; min-width: 30px; padding: 6px 8px; cursor: pointer; }
  #fmtBar button:hover, #codeTools button:hover { background: var(--surface-2); }
  #fmtBar .b { font-weight: 700; } #fmtBar .i { font-style: italic; } #fmtBar .u { text-decoration: underline; }
  #fmtBar .clr { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; cursor: pointer; }

  #badge { font-size: 12px; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; color: var(--text-dim); }
  #filename { font-size: 13px; color: var(--text); margin-left: 4px; }
  #status { margin-left: auto; font-size: 12px; color: var(--text-dim); }
  .dirty { color: var(--accent) !important; }

  #main { flex: 1; display: flex; min-height: 0; }
  #main.split-h { flex-direction: row; }
  #main.split-v { flex-direction: column; }
  #left, #right { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  #divider { background: var(--border); flex-shrink: 0; }
  #main.split-h #divider { width: 6px; cursor: col-resize; }
  #main.split-v #divider { height: 6px; cursor: row-resize; }
  #main.only-code #right, #main.only-code #divider { display: none; }
  #main.only-visual #left, #main.only-visual #divider { display: none; }

  .paneToolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 5px 10px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .barlabel-text { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .paneTools { display: inline-flex; align-items: center; gap: 3px; flex-wrap: wrap; }
  .paneTools button { font-size: 12px; }
  .paneTools select { font-size: 12px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; cursor: pointer; }
  .paneTools select:focus { border-color: var(--accent); outline: none; }

  #left .CodeMirror { flex: 1; height: auto; font-size: 13px; line-height: 1.5; font-family: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
  .CodeMirror.cm-s-material-darker { background: var(--bg); color: var(--text); }
  .cm-s-material-darker .CodeMirror-gutters { background: var(--surface); border-right: 1px solid var(--border); }
  .cm-s-material-darker .CodeMirror-linenumber { color: var(--text-dim); }
  .cm-s-material-darker .CodeMirror-cursor { border-left: 1px solid var(--accent); }
  .cm-s-material-darker div.CodeMirror-selected { background: rgba(70,187,160,.28); }
  .cm-s-material-darker .CodeMirror-line::selection, .cm-s-material-darker .CodeMirror-line ::selection { background: rgba(70,187,160,.28); }
  #code { flex: 1; width: 100%; resize: none; border: none; outline: none; background: var(--bg); color: var(--text); padding: 12px; font-family: ui-monospace, "JetBrains Mono", Consolas, monospace; font-size: 13px; line-height: 1.5; }
  .CodeMirror .cm-sync-hl { background: var(--match); border-radius: 2px; box-shadow: 0 0 0 1px rgba(245,196,81,.4); }

  #frameWrap { flex: 1; overflow: auto; background: var(--surface-2); display: flex; justify-content: center; align-items: flex-start; }
  #view { width: 100%; height: 100%; border: none; background: #fff; transition: width .2s; }
  #frameWrap.device #view { height: calc(100% - 24px); margin: 12px 0; box-shadow: 0 8px 30px rgba(0,0,0,.45); border-radius: var(--radius); }

  #imgDialog { display: none; position: fixed; inset: 0; background: rgba(6,10,34,.6); z-index: 100; align-items: center; justify-content: center; }
  #imgDialog .box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 440px; max-width: 92vw; }
  #imgDialog h3 { font-size: 16px; margin-bottom: 14px; color: var(--text); }
  #imgDialog label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
  #imgDialog input[type=text] { width: 100%; margin-top: 4px; padding: 7px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  #imgDialog input[type=text]:focus { border-color: var(--accent); outline: none; }
  #imgDialog img { max-width: 100%; max-height: 150px; display: block; margin: 6px auto 0; background: var(--bg); border-radius: 6px; }
  #imgDialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  #imgDialog button, #colorPop .brow button { border: none; border-radius: var(--radius); padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--accent-ink); background: var(--accent); }
  #imgDialog button:hover, #colorPop .brow button:hover { background: var(--accent-hi); }
  #imgDialog button#imgCancel, #colorCancel { background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 400; }
  #imgDialog button#imgCancel:hover, #colorCancel:hover { background: var(--surface-2); }

  #colorPop { display: none; position: fixed; z-index: 110; width: 216px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  #colorPop .sv { position: relative; width: 100%; height: 128px; border-radius: 6px; cursor: crosshair; overflow: hidden; }
  #colorPop .sv .sat, #colorPop .sv .val { position: absolute; inset: 0; }
  #colorPop .sv .sat { background: linear-gradient(to right, #fff, rgba(255,255,255,0)); }
  #colorPop .sv .val { background: linear-gradient(to top, #000, rgba(0,0,0,0)); }
  #colorPop .sv .dot { position: absolute; width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%,-50%); box-shadow: 0 0 0 1px rgba(0,0,0,.5); pointer-events: none; }
  #colorPop .hue { position: relative; width: 100%; height: 14px; margin-top: 8px; border-radius: 7px; cursor: pointer; background: linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
  #colorPop .hue .dot { position: absolute; top: 50%; width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%,-50%); box-shadow: 0 0 0 1px rgba(0,0,0,.5); pointer-events: none; }
  #colorPop .prow { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  #colorPop .prev { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border); flex-shrink: 0; }
  #colorPop .hex { flex: 1; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-family: ui-monospace, monospace; font-size: 13px; }
  #colorPop .swrow { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 8px; }
  #colorPop .swrow button { width: 100%; height: 18px; border: 1px solid var(--border); border-radius: 3px; padding: 0; cursor: pointer; }
  #colorPop .brow { display: flex; gap: 8px; justify-content: flex-end; }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 14px); z-index: 200; max-width: 80vw;
    background: rgba(23, 31, 82, .78); color: var(--text); border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px; padding: 11px 20px; font-size: 13.5px; box-shadow: 0 10px 34px rgba(0,0,0,.35);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
  <div id="toolbar">
    <span id="filename" data-i18n="untitled">Untitled</span>
    <span class="sep"></span>
    <button id="openBtn" data-i18n="open">Open</button>
    <button id="saveBtn" data-i18n="save">Save</button>
    <button id="saveAsBtn" data-i18n="saveAs">Save as</button>
    <button id="newBtn" data-i18n="new">New</button>
    <span class="sep"></span>
    <button id="undoBtn" data-i18n-title="undo" title="Undo">↶</button>
    <button id="redoBtn" data-i18n-title="redo" title="Redo">↷</button>
    <span class="sep"></span>
    <select id="layoutSel" title="Affichage">
      <option value="split-h" data-i18n="layoutH">⬌ Side by side</option>
      <option value="split-v" data-i18n="layoutV">⬍ Stacked</option>
      <option value="code" data-i18n="layoutCode">▤ Code only</option>
      <option value="visual" data-i18n="layoutVisual">▥ Visual only</option>
    </select>
    <span id="status"></span>
    <select id="langSel">
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="fr">Français</option>
      <option value="ja">日本語</option>
      <option value="de">Deutsch</option>
    </select>
    <a id="siteLink" href="https://empowia.com" target="_blank" rel="noopener">EMPOWIA.COM</a>
  </div>

  <div id="main">
    <div id="left">
      <div class="paneToolbar">
        <div id="codeTools" class="paneTools">
          <button id="formatBtn" data-i18n="format" title="Ctrl+Shift+F">Format</button>
          <button id="foldAllBtn" data-i18n="foldAll">Fold all</button>
          <button id="unfoldAllBtn" data-i18n="unfoldAll">Unfold all</button>
        </div>
      </div>
      <textarea id="code" spellcheck="false"></textarea>
    </div>
    <div id="divider"></div>
    <div id="right">
      <div class="paneToolbar">
        <div class="paneTools">
          <div id="fmtBar">
            <button data-cmd="bold" class="b" data-i18n-title="bold" title="Bold">B</button>
            <button data-cmd="italic" class="i" data-i18n-title="italic" title="Italic">I</button>
            <button data-cmd="underline" class="u" data-i18n-title="underline" title="Underline">U</button>
            <span class="sep"></span>
            <button data-block="H1" title="Titre 1">T1</button>
            <button data-block="H2" title="Titre 2">T2</button>
            <button data-block="H3" title="Titre 3">T3</button>
            <button data-block="P" data-i18n-title="para" title="Paragraph">¶</button>
            <span class="sep"></span>
            <button data-cmd="insertUnorderedList" data-i18n-title="ulist" title="Bullet list">• ≡</button>
            <button data-cmd="insertOrderedList" data-i18n-title="olist" title="Numbered list">1. ≡</button>
            <button data-link="1" data-i18n-title="link" title="Insert link">🔗</button>
            <button data-cmd="removeFormat" data-i18n-title="clear" title="Clear formatting">✕</button>
            <span class="sep"></span>
            <button data-color="foreColor" class="clr" data-i18n-title="textColor" title="Text color">A</button>
            <button data-color="highlight" class="clr" data-i18n-title="highlight" title="Highlight">▮</button>
            <button data-img="1" data-i18n-title="insertImg" title="Insert image">🖼️</button>
          </div>
          <select id="deviceSel" title="Aperçu">
            <option value="0" data-i18n="desktop">Desktop</option>
            <option value="768" data-i18n="tablet">Tablet</option>
            <option value="375" data-i18n="mobile">Mobile</option>
          </select>
          <select id="protectSel">
            <option value="free" data-i18n="protFree" data-i18n-title="badgeFree">🔓 Full</option>
            <option value="warn" data-i18n="protWarn" data-i18n-title="badgeWarn">🛡️ Ask first</option>
            <option value="text" data-i18n="protText" data-i18n-title="badgeText">🔒 Text only</option>
          </select>
        </div>
      </div>
      <div id="frameWrap"><iframe id="view"></iframe></div>
    </div>
  </div>

  <div id="imgDialog">
    <div class="box">
      <h3 data-i18n="imgTitle">Edit image</h3>
      <label><span data-i18n="imgUrl">Image URL</span><input id="imgSrc" type="text"></label>
      <label><span data-i18n="imgAlt">Alt text</span><input id="imgAlt" type="text"></label>
      <label><span data-i18n="imgWidth">Width</span><input id="imgW" type="text"></label>
      <img id="imgPrev" alt="">
      <div class="row">
        <button id="imgCancel" data-i18n="cancel">Cancel</button>
        <button id="imgApply" data-i18n="apply">Apply</button>
      </div>
    </div>
  </div>

  <div id="colorPop">
    <div class="sv" id="cpSV"><div class="sat"></div><div class="val"></div><div class="dot" id="cpSVDot"></div></div>
    <div class="hue" id="cpHue"><div class="dot" id="cpHueDot"></div></div>
    <div class="prow"><span class="prev" id="cpPrev"></span><input class="hex" id="colorInput" value="#111111" spellcheck="false"></div>
    <div class="swrow" id="colorSwatches"></div>
    <div class="brow"><button id="colorCancel" data-i18n="cancel">Cancel</button><button id="colorApply" data-i18n="apply">Apply</button></div>
  </div>

  <div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/comment-fold.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-html.min.js"></script>

<script>
  /* ============ i18n ============ */
  const I18N = {

      opened:'Opened', openedDl:'Opened (saving downloads a file on this browser)', savedFile:'Saved to file', saveFail:'Save failed: ', savedAs:'Saved as', downloaded:'Downloaded', formatted:'Formatted',

      sample:'<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<title>HTML Tweak — quick guide</title>\n<style>\n  body { font-family: Georgia, serif; max-width: 720px; margin: 40px auto; padding: 0 24px; line-height: 1.7; color: #222; }\n  h1 { color: #0e639c; margin-bottom: 4px; }\n  h2 { color: #0e639c; font-size: 20px; margin-top: 26px; }\n  .lead { color: #555; }\n  code { background: #eef1fb; padding: 1px 6px; border-radius: 4px; font-size: .9em; }\n  .tip { background: #f1faf6; border-left: 3px solid #46BBA0; padding: 10px 14px; border-radius: 4px; margin-top: 22px; }\n  a { color: #0e639c; }\n</style>\n</head>\n<body>\n  <h1>Welcome to HTML Tweak ✏️</h1>\n  <p class="lead">This page is <b>fully editable</b> and doubles as your quick guide. Click anywhere on the right and start typing — or delete it all and paste your own HTML.</p>\n\n  <h2>1 · Two ways to edit</h2>\n  <ul>\n    <li><b>Right (visual)</b> — click and type like a document. Select text, then use the toolbar to make it bold, a heading, a list, coloured…</li>\n    <li><b>Left (code)</b> — edit the HTML directly. Both sides stay in sync.</li>\n    <li>Click anything on the right and its code lights up on the left.</li>\n  </ul>\n\n  <h2>2 · Layout</h2>\n  <p>Top toolbar → the display menu: <b>side by side</b>, <b>stacked</b>, <b>code only</b> or <b>visual only</b>. Drag the divider in the middle to resize.</p>\n\n  <h2>3 · Protect your structure</h2>\n  <ul>\n    <li>🔓 <b>Full</b> — change anything, text and structure.</li>\n    <li>🛡️ <b>Ask first</b> — edit freely, but it confirms before changing the structure.</li>\n    <li>🔒 <b>Text only</b> — only the words change; the layout can never break. Perfect if you do not know code.</li>\n  </ul>\n\n  <h2>4 · Format &amp; media</h2>\n  <p>Select text, then use <b>B</b> / <i>I</i> / <u>U</u>, headings, lists, <a href="https://empowia.com">links</a>, and the <b>A</b> / ▮ colour buttons. Click any image to change its URL, alt text or size.</p>\n\   function esc(x){ return x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

      const pad = IND.repeat(depth), tag = el.tagName.toLowerCase();
      s += pad; const start = s.length;

      if (RAW.has(tag)) { s+='<'+tag+attrsOf(el)+'>'+el.textContent+'</'+tag+'>'; ranges.push({el,start,end:s.length}); s+='\n'; return; }
      if (isInlineOnly(el)) { s+='<'+tag+attrsOf(el)+'>';
        for (const c of el.childNodes){ if (c.nodeType===3) s+=esc(c.nodeValue); else if (c.nodeType===1) s+=serInline(c); }
        s+='</'+tag+'>'; ranges.push({el,start,end:s.length}); s+='\n'; return; }
      s += '<'+tag+attrsOf(el)+'>\n';
      for (const c of el.childNodes){ if (c.nodeType===1) walk(c, depth+1);
        else if (c.nodeType===3){ const x=c.nodeValue.trim(); if(x) s+=IND.repeat(depth+1)+esc(x)+'\n'; }
        else if (c.nodeType===8) s+=IND.repeat(depth+1)+'<!--'+c.nodeValue+'-->\n'; }
      s += pad+'</'+tag+'>'; ranges.push({el,start,end:s.length}); s+='\n';
    }
    walk(doc.documentElement, 0);
    return { code: s.replace(/\n+$/,''), ranges };
  }

  /* ============ éditeur de gauche ============ */
  function getCode(){ return cm ? cm.getValue() : codeArea.value; }
  function setLeft(v){ programmatic = true; if (cm){ const c=cm.getCursor(); cm.setValue(v); try{cm.setCursor(c);}catch(e){} } else codeArea.value = v; programmatic = false; }
  function onCodeEdit(){ if (programmatic || activeSide!=='code') return; markDirty(true); clearSyncMark(); clearTimeout(codeTimer); codeTimer = setTimeout(refreshRight, 350); }
  function initLeftEditor(){
    if (typeof CodeMirror!=='undefined' && typeof CodeMirror.fromTextArea==='function'){
      try { cm = CodeMirror.fromTextArea(codeArea, { mode:'htmlmixed', theme:'material-darker', lineNumbers:true, lineWrapping:true, indentUnit:2, tabSize:2, foldGutter:true, gutters:['CodeMirror-linenumbers','CodeMirror-foldgutter'], matchTags:{bothTags:true} }); } catch(e){ cm=null; }
    }
    if (cm){ cm.on('focus', ()=>{ activeSide='code'; }); cm.on('change', onCodeEdit); }
    else { codeArea.style.display=''; codeArea.addEventListener('focus', ()=>{ activeSide='code'; }); codeArea.addEventListener('input', onCodeEdit);
      codeArea.addEventListener('keydown', (e)=>{ if(e.key==='Tab'){ e.preventDefault(); const st=codeArea.selectionStart,en=codeArea.selectionEnd; codeArea.value=codeArea.value.slice(0,st)+'  '+codeArea.value.slice(en); codeArea.selectionStart=codeArea.selectionEnd=st+2; } }); }
  }

  /* ============ synchro / rendu ============ */
  function refreshRight(){ leftIsRaw = true; frame.srcdoc = getCode(); scheduleDraft(); }   // recharge l'aperçu SANS re-générer le code (préserve le brut)
  function visualToCode(){ const doc = frame.contentDocument; if(!doc||!doc.documentElement) return; const r = buildCode(doc); lastRanges = r.ranges; setLeft(r.code); leftIsRaw = false; scheduleDraft(); }
  function scheduleDraft(){ clearTimeout(draftTimer); draftTimer=setTimeout(()=>{ try{ localStorage.setItem('htmlstudio_doc', getCode()); }catch(e){} }, 600); }
  function getSource(){ if (activeSide==='visual') visualToCode(); return getCode(); }

  function clearSyncMark(){ if (syncMark){ try{ syncMark.clear(); }catch(e){} syncMark=null; } }
  function locateFromVisual(){
    const doc = frame.contentDocument; if(!doc) return;
    if (leftIsRaw) visualToCode();                       // normalise à la volée pour que les positions collent
    const sel = doc.getSelection(); if(!sel||!sel.anchorNode) return;
    let el = sel.anchorNode; if (el.nodeType===3) el = el.parentElement;
    const map = new Map(lastRanges.map(r=>[r.el,r]));
    while (el && !map.has(el)) el = el.parentElement;
    if (!el) return; const r = map.get(el); clearSyncMark();
    if (cm){ const from=cm.posFromIndex(r.start), to=cm.posFromIndex(r.end); syncMark=cm.markText(from,to,{className:'cm-sync-hl'}); cm.scrollIntoView({from,to},40); }
    else { codeArea.focus(); try{ codeArea.setSelectionRange(r.start,r.end); }catch(e){} }
  }

  /* ============ protections ============ */
  function enableContentOnly(doc){        // « texte seul »
    const win = frame.contentWindow;
    doc.addEventListener('beforeinput', (e)=>{ if (isStructural(e,doc,win)){ e.preventDefault(); flash(t('locked')); } });
    doc.addEventListener('paste', (e)=>{ e.preventDefault(); const cd=e.clipboardData||win.clipboardData; const x=cd?cd.getData('text/plain'):''; if(x) doc.execCommand('insertText',false,x); });
    doc.addEventListener('drop', (e)=>e.preventDefault());
  }
  function blockOf(node, win){ let el = node && node.nodeType===3 ? node.parentElement : node;
    while (el && el.parentElement){ const d = win.getComputedStyle(el).display; if (d && d.indexOf('inline')!==0) return el; el = el.parentElement; } return el; }
  function caretAtBlockEdge(range, doc, win, atEnd){ const block=blockOf(range.startContainer,win); if(!block) return false;
    const r=doc.createRange(); r.selectNodeContents(block); if(atEnd) r.setStart(range.startContainer,range.startOffset); else r.setEnd(range.startContainer,range.startOffset);
    return r.toString().replace(/[\s​]/g,'').length===0; }
  function isStructural(e, doc, win){ const it=e.inputType||'';
    if (/^format/.test(it)) return true;                 // en mode texte, le gras/couleur = ajout de balise = interdit
    if (/^(insertParagraph|insertLineBreak|insertOrderedList|insertUnorderedList|insertHorizontalRule|insertHTML|insertFromDrop)$/.test(it)) return true;
    const sel=doc.getSelection(); if(!sel||sel.rangeCount===0) return false; const range=sel.getRangeAt(0);
    if (!range.collapsed) return blockOf(range.startContainer,win)!==blockOf(range.endContainer,win);
    if (/^delete.*Backward$/.test(it)) return caretAtBlockEdge(range,doc,win,false);
    if (/^delete.*Forward$/.test(it)) return caretAtBlockEdge(range,doc,win,true);
    return false; }
  function snap(){ const d=frame.contentDocument; if(d&&d.documentElement) snapshot='<!DOCTYPE html>\n'+d.documentElement.outerHTML; }
  function restoreSnapshot(){ pendingRestore=true; leftIsRaw=true; frame.srcdoc = snapshot; flash(t('structUndo')); }
  function startGuard(doc){                // « alerte structure »
    guardObs = new MutationObserver(muts=>{
      if (guardPaused) return;
      const structural = muts.some(m=>m.type==='childList' && (
        [...m.addedNodes].some(n=>n.nodeType===1 && !INLINE.has(n.tagName.toLowerCase())) ||
        [...m.removedNodes].some(n=>n.nodeType===1 && !INLINE.has(n.tagName.toLowerCase())) ));
      if (!structural) return;
      guardObs.disconnect();
      if (confirm(t('confirmStruct'))) { snap(); markDirty(true); visualToCode(); guardObs.observe(doc.body, GUARD_OPT); }
      else restoreSnapshot();
    });
    guardObs.observe(doc.body, GUARD_OPT);
  }

  /* ============ chargement de l'iframe (le visuel est TOUJOURS éditable) ============ */
  frame.addEventListener('load', ()=>{
    const doc = frame.contentDocument; if(!doc) return;
    if (guardObs){ try{ guardObs.disconnect(); }catch(e){} guardObs=null; }
    try{ doc.designMode='on'; }catch(e){}
    if (protect==='text') enableContentOnly(doc);
    else if (protect==='warn'){ snap(); startGuard(doc); }
    doc.addEventListener('input', ()=>{ if(activeSide!=='visual') return; markDirty(true); clearTimeout(codeTimer); codeTimer=setTimeout(visualToCode,250); });
    const fv = ()=>{ activeSide='visual'; };
    doc.addEventListener('focusin', fv); doc.addEventListener('mousedown', fv); doc.addEventListener('keydown', fv);
    doc.addEventListener('selectionchange', ()=>{ if(activeSide!=='visual') return;
      const s=doc.getSelection(); if (s && s.rangeCount) lastRange = s.getRangeAt(0).cloneRange();
      clearTimeout(syncTimer); syncTimer=setTimeout(locateFromVisual,120); });
    doc.addEventListener('click', (e)=>{ if (e.target && e.target.tagName==='IMG') openImageDialog(e.target); });
    pendingRestore = false;
  });

  /* ============ affichage (layout) ============ */
  function applyLayoutUI(){
    mainEl.classList.remove('split-h','split-v','only-code','only-visual');
    mainEl.classList.add(layout==='code'?'only-code' : layout==='visual'?'only-visual' : layout);
    document.getElementById('left').style.flex = '';
    document.getElementById('right').style.flex = '';
    document.getElementById('fmtBar').style.display = (protect!=='text') ? '' : 'none';  // texte seul = pas de mise en forme
    if (cm) setTimeout(()=>cm.refresh(), 50);
  }
  function setLayout(l){ layout=l; try{ localStorage.setItem('htmlstudio_layout', l); }catch(e){} document.getElementById('layoutSel').value=l; applyLayoutUI(); }
  document.getElementById('layoutSel').addEventListener('change', (e)=>setLayout(e.target.value));

  /* ============ protection ============ */
  function applyProtectUI(){
    document.getElementById('fmtBar').style.display = (protect!=='text') ? '' : 'none';
    document.getElementById('protectSel').title = t({ free:'badgeFree', text:'badgeText', warn:'badgeWarn' }[protect]);  // explication en info-bulle
  }
  function setProtect(p){
    if (activeSide==='visual') visualToCode();      // fige les modifs visuelles en cours
    protect=p;
    if (guardObs){ guardObs.disconnect(); guardObs=null; }
    document.getElementById('protectSel').value=p;
    applyProtectUI();
    refreshRight();                                  // recharge pour appliquer la nouvelle protection
  }
  document.getElementById('protectSel').addEventListener('change', (e)=>setProtect(e.target.value));

  /* ============ langue ============ */
  function applyLang(){
    document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.title = t(el.dataset.i18nTitle); });
    document.documentElement.lang = lang;
    if (!dirty && !fileHandle) filenameEl.textContent = t('untitled');
    applyProtectUI();
  }
  document.getElementById('langSel').addEventListener('change', (e)=>{ lang = e.target.value; try{ localStorage.setItem('htmlstudio_lang', lang); }catch(err){} applyLang(); });

  /* ============ barre de mise en forme (visuel) ============ */
  const fmtBar = document.getElementById('fmtBar');
  fmtBar.addEventListener('mousedown', (e)=>e.preventDefault());   // garde la sélection dans l'iframe
  fmtBar.addEventListener('click', (e)=>{
    const btn = e.target.closest('button'); if(!btn) return;
    if (btn.dataset.color){ openColorPop(btn.dataset.color==='highlight'?'hiliteColor':'foreColor', btn); return; }
    const doc = frame.contentDocument; if(!doc) return;
    frame.contentWindow.focus(); activeSide='visual'; if (protect==='warn') guardPaused=true;
    if (btn.dataset.cmd) doc.execCommand(btn.dataset.cmd,false,null);
    else if (btn.dataset.block) doc.execCommand('formatBlock',false,btn.dataset.block);
    else if (btn.dataset.link){ const url=prompt(t('promptLink'),'https://'); if(url) doc.execCommand('createLink',false,url); }
    else if (btn.dataset.img){ const url=prompt(t('imgUrl'),'https://'); if(url) doc.execCommand('insertImage',false,url); }
    setTimeout(()=>{ if(protect==='warn'){ guardPaused=false; snap(); } markDirty(true); visualToCode(); }, 0);
  });

  function applyColor(cmd, color){
    const doc = frame.contentDocument; if(!doc) return;
    frame.contentWindow.focus();
    if (lastRange){ try{ const s=doc.getSelection(); s.removeAllRanges(); s.addRange(lastRange); }catch(e){} }
    if (protect==='warn') guardPaused=true;
    try{ doc.execCommand('styleWithCSS',false,true); }catch(e){}
    doc.execCommand(cmd,false,color);
    setTimeout(()=>{ if(protect==='warn'){ guardPaused=false; snap(); } markDirty(true); visualToCode(); }, 0);
  }
  /* popover couleur — panneau complet visible d'emblée + Appliquer / Annuler */
  const colorPop = document.getElementById('colorPop');
  const cpSV = document.getElementById('cpSV'), cpHue = document.getElementById('cpHue');
  const cpSVDot = document.getElementById('cpSVDot'), cpHueDot = document.getElementById('cpHueDot');
  const cpPrev = document.getElementById('cpPrev'), hexInput = document.getElementById('colorInput');
  const PALETTE = ['#0E1544','#171F52','#212A63','#46BBA0','#5FD0B6','#E7EAF6','#97A0C6','#000000','#e11d48','#f97316','#eab308','#22c55e','#0ea5e9','#6366f1','#a855f7','#ffffff'];
  let colorCmd = 'foreColor', colorRange = null;
  let ch = 150, cs = 0.7, cv = 0.6;   // teinte / saturation / valeur courantes

  function hsv2rgb(h,s,v){ const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c; let r,g,b;
    if(h<60){r=c;g=x;b=0;}else if(h<120){r=x;g=c;b=0;}else if(h<180){r=0;g=c;b=x;}
    else if(h<240){r=0;g=x;b=c;}else if(h<300){r=x;g=0;b=c;}else{r=c;g=0;b=x;}
    return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]; }
  function rgb2hsv(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let h=0;
    if(d){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; }
    return [h, mx?d/mx:0, mx]; }
  function hex2rgb(x){ x=(x||'').replace('#','').trim(); if(x.length===3)x=x.split('').map(c=>c+c).join(''); if(!/^[0-9a-fA-F]{6}$/.test(x))return null; const n=parseInt(x,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
  function rgb2hex(r,g,b){ return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''); }
  function curHex(){ return rgb2hex.apply(null, hsv2rgb(ch,cs,cv)); }

  function renderPicker(){
    cpSV.style.background = 'hsl('+ch+',100%,50%)';
    cpSVDot.style.left = (cs*100)+'%'; cpSVDot.style.top = ((1-cv)*100)+'%';
    cpHueDot.style.left = (ch/360*100)+'%';
    const hex = curHex(); cpPrev.style.background = hex;
    if (document.activeElement !== hexInput) hexInput.value = hex;
  }
  function setFromHex(hex){ const rgb=hex2rgb(hex); if(!rgb) return; const hsv=rgb2hsv(rgb[0],rgb[1],rgb[2]); ch=hsv[0];cs=hsv[1];cv=hsv[2]; renderPicker(); }

  (function(){ const box=document.getElementById('colorSwatches'); PALETTE.forEach(c=>{ const b=document.createElement('button'); b.type='button'; b.style.background=c; b.title=c; b.addEventListener('click',()=>setFromHex(c)); box.appendChild(b); }); })();

  function svPick(e){ const r=cpSV.getBoundingClientRect(); cs=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); cv=1-Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)); renderPicker(); }
  function huePick(e){ const r=cpHue.getBoundingClientRect(); ch=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*360; renderPicker(); }
  function dragify(el, fn){ el.addEventListener('mousedown', (e)=>{ e.preventDefault(); fn(e); const mv=ev=>fn(ev); const up=()=>{ window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up); }; window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up); }); }
  dragify(cpSV, svPick); dragify(cpHue, huePick);
  hexInput.addEventListener('input', ()=>{ if(hex2rgb(hexInput.value)) setFromHex(hexInput.value); });

  function openColorPop(cmd, anchorBtn){
    colorCmd = cmd; colorRange = lastRange ? lastRange.cloneRange() : null;
    colorPop.style.display = 'block';
    const r = anchorBtn.getBoundingClientRect();
    colorPop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - colorPop.offsetWidth - 8)) + 'px';
    colorPop.style.top = Math.max(8, Math.min(r.bottom + 4, window.innerHeight - colorPop.offsetHeight - 8)) + 'px';
    renderPicker();
  }
  function closeColorPop(){ colorPop.style.display='none'; }
  document.getElementById('colorApply').addEventListener('click', ()=>{ lastRange = colorRange; applyColor(colorCmd, curHex()); closeColorPop(); });
  document.getElementById('colorCancel').addEventListener('click', closeColorPop);
  document.addEventListener('mousedown', (e)=>{ if (colorPop.style.display==='block' && !colorPop.contains(e.target) && !e.target.closest('[data-color]')) closeColorPop(); });

  /* ============ édition d'image ============ */
  const imgDialog = document.getElementById('imgDialog');
  function openImageDialog(img){
    currentImg = img;
    document.getElementById('imgSrc').value = img.getAttribute('src') || '';
    document.getElementById('imgAlt').value = img.getAttribute('alt') || '';
    document.getElementById('imgW').value = img.getAttribute('width') || '';
    document.getElementById('imgPrev').src = img.getAttribute('src') || '';
    imgDialog.style.display = 'flex';
  }
  function closeImageDialog(){ imgDialog.style.display='none'; currentImg=null; }
  document.getElementById('imgSrc').addEventListener('input', (e)=>{ document.getElementById('imgPrev').src = e.target.value; });
  document.getElementById('imgCancel').addEventListener('click', closeImageDialog);
  imgDialog.addEventListener('click', (e)=>{ if (e.target===imgDialog) closeImageDialog(); });
  document.getElementById('imgApply').addEventListener('click', ()=>{
    if (!currentImg) return closeImageDialog();
    const src=document.getElementById('imgSrc').value.trim(), alt=document.getElementById('imgAlt').value, w=document.getElementById('imgW').value.trim();
    if (src) currentImg.setAttribute('src', src);
    currentImg.setAttribute('alt', alt);
    if (w) currentImg.setAttribute('width', w); else currentImg.removeAttribute('width');
    closeImageDialog(); markDirty(true); visualToCode();
  });

  /* ============ outils code ============ */
  document.getElementById('formatBtn').addEventListener('click', formatCode);
  function formatCode(){ if (typeof html_beautify!=='function'){ flash('—'); return; }
    const cur = cm?cm.getCursor():null; const pretty = html_beautify(getCode(), { indent_size:2, wrap_line_length:0, preserve_newlines:true, max_preserve_newlines:2, indent_inner_html:true });
    setLeft(pretty); if (cm&&cur) cm.setCursor(cur); refreshRight(); flash(t('formatted')); }
  document.getElementById('foldAllBtn').addEventListener('click', ()=>setAllFold(true));
  document.getElementById('unfoldAllBtn').addEventListener('click', ()=>setAllFold(false));
  function setAllFold(fold){ if(!cm){ flash(t('foldNo')); return; } cm.operation(()=>{ for(let l=cm.firstLine(); l<=cm.lastLine(); l++) cm.foldCode({line:l,ch:0}, null, fold?'fold':'unfold'); }); }
  document.getElementById('deviceSel').addEventListener('change', (e)=>{
    const w = parseInt(e.target.value,10);
    if (w===0){ frameWrap.classList.remove('device'); frame.style.width='100%'; } else { frameWrap.classList.add('device'); frame.style.width=w+'px'; }
  });

  /* ============ annuler / rétablir ============ */
  const undoBtn = document.getElementById('undoBtn'), redoBtn = document.getElementById('redoBtn');
  [undoBtn, redoBtn].forEach(b=>b.addEventListener('mousedown', e=>e.preventDefault()));
  undoBtn.addEventListener('click', ()=>histCmd('undo'));
  redoBtn.addEventListener('click', ()=>histCmd('redo'));
  function histCmd(kind){
    if (activeSide==='code' && cm){ (kind==='undo'?cm.undo():cm.redo()); return; }
    const doc = frame.contentDocument; if(!doc) return; frame.contentWindow.focus();
    if (protect==='warn') guardPaused=true;
    doc.execCommand(kind,false,null);
    setTimeout(()=>{ if(protect==='warn'){ guardPaused=false; snap(); } markDirty(true); visualToCode(); }, 0);
  }

  /* ============ fichiers ============ */
  document.getElementById('openBtn').addEventListener('click', openFile);
  async function openFile(){
    if (hasFSA){ try { const [h]=await window.showOpenFilePicker({ types:[{description:'HTML', accept:{'text/html':['.html','.htm']}}] });
      fileHandle=h; const text=await (await h.getFile()).text(); setLeft(text); refreshRight(); markDirty(false); flash(t('opened')); } catch(e){} }
    else { const inp=document.createElement('input'); inp.type='file'; inp.accept='.html,.htm';
      inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return; fileHandle=null; filenameEl.textContent=f.name; const text=await f.text(); setLeft(text); refreshRight(); markDirty(false); flash(t('openedDl')); }; inp.click(); }
  }
  document.getElementById('saveBtn').addEventListener('click', save);
  async function save(){ const content = getSource();
    if (hasFSA && fileHandle){ try { const w=await fileHandle.createWritable(); await w.write(content); await w.close(); markDirty(false); flash(t('savedFile')); } catch(e){ flash(t('saveFail')+e.message); } }
    else saveAs(); }
  document.getElementById('saveAsBtn').addEventListener('click', saveAs);
  async function saveAs(){ const content = getSource();
    if (hasFSA){ try { const h=await window.showSaveFilePicker({ suggestedName: fileHandle?fileHandle.name:'page.html', types:[{description:'HTML', accept:{'text/html':['.html','.htm']}}] });
      const w=await h.createWritable(); await w.write(content); await w.close(); fileHandle=h; markDirty(false); flash(t('savedAs')); } catch(e){} }
    else { const b=new Blob([content],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fileHandle?fileHandle.name:'page.html'; a.click(); URL.revokeObjectURL(a.href); markDirty(false); flash(t('downloaded')); }
  }
  document.getElementById('newBtn').addEventListener('click', ()=>{
    if (dirty && !confirm(t('confirmNew'))) return; fileHandle=null;
    const html='<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="UTF-8">\n  <title>'+t('untitled')+'</title>\n</head>\n<body>\n  <h1>'+t('untitled')+'</h1>\n  <p></p>\n</body>\n</html>';
    setLeft(html); refreshRight(); markDirty(false); filenameEl.textContent=t('untitled');
  });

  window.addEventListener('keydown', (e)=>{ if ((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){ e.preventDefault(); save(); } });
  window.addEventListener('beforeunload', (e)=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

  /* ============ démarrage ============ */
  initLeftEditor();
  try { const sl=localStorage.getItem('htmlstudio_layout'); if (sl) layout=sl; } catch(e){}   // la protection démarre toujours sur « free »
  document.getElementById('langSel').value = lang;
  document.getElementById('layoutSel').value = layout;
  document.getElementById('protectSel').value = protect;
  applyLang();
  applyLayoutUI();
  let draft=null; try{ draft=localStorage.getItem('htmlstudio_doc'); }catch(e){}
  setLeft((draft && draft.trim()) ? draft : t('sample'));
  refreshRight();
  markDirty(false);
  if (draft && draft.trim()) flash(t('draft'));
  if (!hasFSA) flash(t('noFSA'));

  /* ============ séparateur (H ou V) ============ */
  const divider = document.getElementById('divider'), leftPane = document.getElementById('left'); let dragging=false;
  divider.addEventListener('mousedown', ()=>{ dragging=true; document.body.style.userSelect='none'; frame.style.pointerEvents='none'; });  // l'iframe ne capture plus la souris pendant le glissement
  window.addEventListener('mouseup', ()=>{ if(dragging){ dragging=false; document.body.style.userSelect=''; frame.style.pointerEvents=''; } });
  window.addEventListener('mousemove', (e)=>{
    if(!dragging) return;
    const rect = mainEl.getBoundingClientRect();
    let pct = (layout==='split-v') ? (e.clientY-rect.top)/rect.height*100 : (e.clientX-rect.left)/rect.width*100;
    pct = Math.min(85, Math.max(15, pct));
    leftPane.style.flex = '0 0 '+pct+'%';
    if (cm) cm.refresh();
  });
</script>
</body>
</html>
